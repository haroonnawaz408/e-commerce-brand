  const [activeTab, setActiveTab] = useState("home");

  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);

  const [cart, setCart] = useState([]);
  const [wishlist, setWishlist] = useState([]);
  const [isCartOpen, setIsCartOpen] = useState(false);
  const [isWishlistOpen, setIsWishlistOpen] = useState(false);
  const [isSearchOpen, setIsSearchOpen] = useState(false);
  const [searchQuery, setSearchQuery] = useState("");
  const [quickViewProduct, setQuickViewProduct] = useState(null);
  const [selectedProductDetails, setSelectedProductDetails] = useState(null);
  const [toastMessage, setToastMessage] = useState(null);
  const [isCheckoutOpen, setIsCheckoutOpen] = useState(false);

  const [selectedCategory, setSelectedCategory] = useState("All");
  const [sortBy, setSortBy] = useState("featured");

  useEffect(() => {
    const handleScroll = () => setScrolled(window.scrollY > 40);
    window.addEventListener("scroll", handleScroll);
    return () => window.removeEventListener("scroll", handleScroll);
  }, []);

  const showToast = (msg) => {
    setToastMessage(msg);
    setTimeout(() => setToastMessage(null), 3000);
  };

  const addToCart = (product, selectedSize = null, selectedColor = null) => {
    const size = selectedSize || product.sizes[0];
    const color = selectedColor || product.colors[0];
    const cartItemId = `${product.id}-${size}-${color}`;

    setCart((prev) => {
      const existing = prev.find((item) => item.cartItemId === cartItemId);
      if (existing) {
        return prev.map((item) =>
          item.cartItemId === cartItemId
            ? { ...item, quantity: item.quantity + 1 }
            : item
        );
      }
      return [
        ...prev,
        {
          ...product,
          cartItemId,
          selectedSize: size,
          selectedColor: color,
          quantity: 1
        }
      ];
    });
    showToast(`Added "${product.name}" to your shopping bag.`);
  };

  const updateQuantity = (cartItemId, delta) => {
    setCart((prev) =>
      prev
        .map((item) => {
          if (item.cartItemId === cartItemId) {
            const newQty = item.quantity + delta;
            return newQty > 0 ? { ...item, quantity: newQty } : null;
          }
          return item;
        })
        .filter(Boolean)
    );
  };

  const removeFromCart = (cartItemId) => {
    setCart((prev) => prev.filter((item) => item.cartItemId !== cartItemId));
    showToast("Item removed from your bag.");
  };

  const toggleWishlist = (product) => {
    const isSaved = wishlist.some((item) => item.id === product.id);
    if (isSaved) {
      setWishlist((prev) => prev.filter((item) => item.id !== product.id));
      showToast(`Removed "${product.name}" from your wishlist.`);
    } else {
      setWishlist((prev) => [...prev, product]);
      showToast(`Saved "${product.name}" to your wishlist.`);
    }
  };

  const cartSubtotal = cart.reduce(
    (sum, item) => sum + item.price * item.quantity,
    0
  );
  const cartCount = cart.reduce((sum, item) => sum + item.quantity, 0);

  const filteredSearchProducts = PRODUCTS.filter((p) =>
    p.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
    p.category.toLowerCase().includes(searchQuery.toLowerCase()) ||
    p.collection.toLowerCase().includes(searchQuery.toLowerCase())
  );

  const displayedProducts = PRODUCTS.filter((p) => {
    if (selectedCategory !== "All" && p.category !== selectedCategory) {
      return false;
    }
    return true;
  }).sort((a, b) => {
    if (sortBy === "price-low") return a.price - b.price;
    if (sortBy === "price-high") return b.price - a.price;
    return 0;
  });

                </button>
              </div>
              <div className="flex flex-col space-y-6">
                {["New Arrivals", "Women", "Men", "Collections", "Accessories"].map(

              <p className="text-[10px] text-[#A89A89] uppercase tracking-widest">
                © 2026 LUXURY FASHION ATELIER
              </p>

        </div>
      )}

      {selectedProductDetails ? (

          onBack={() => setSelectedProductDetails(null)}
          onAddToCart={addToCart}
          onToggleWishlist={toggleWishlist}

          allProducts={PRODUCTS}
          onSelectProduct={(p) => setSelectedProductDetails(p)}

      ) : activeTab === "shop" ? (
        <ShopPage
          products={displayedProducts}
          selectedCategory={selectedCategory}
          setSelectedCategory={setSelectedCategory}
          sortBy={sortBy}
          setSortBy={setSortBy}

          onSelectProduct={(p) => setSelectedProductDetails(p)}
          onAddToCart={addToCart}
          onToggleWishlist={toggleWishlist}
          wishlist={wishlist}

      ) : (
        <main className="pt-20">
          <section className="relative h-[90vh] md:h-screen w-full overflow-hidden bg-[#171310] text-[#F7F3EC]">

              <div className="max-w-2xl space-y-6">
                <span className="text-xs uppercase tracking-[0.3em] font-medium text-[#B69A68] inline-block">
                  New Season 2026
                </span>
                <h1 className="font-serif text-5xl md:text-7xl lg:text-8xl font-light leading-[1.05] tracking-tight">
                  Defined by <br />
                  <span className="italic font-normal">Elegance.</span>
                </h1>
                <p className="text-sm md:text-base font-light text-[#EFE8DC]/80 tracking-wide max-w-md">
                  Timeless silhouettes. Refined materials. A new expression of
                  modern luxury.
                </p>

                <div className="pt-4 flex flex-col sm:flex-row gap-4 sm:gap-6">
                  <button
                    onClick={() => setActiveTab("shop")}
                    className="bg-[#F7F3EC] text-[#171310] px-8 py-4 text-xs uppercase tracking-[0.25em] font-medium hover:bg-[#B69A68] hover:text-[#F7F3EC] transition-all text-center"

                  <button

function ProductCard({
  product,
  onQuickView,
  onSelectProduct,
  onAddToCart,
  onToggleWishlist,
  isWishlisted
}) {
  const [isHovered, setIsHovered] = useState(false);

  return (
    <div
      className="group relative flex flex-col cursor-pointer"
      onMouseEnter={() => setIsHovered(true)}
      onMouseLeave={() => setIsHovered(false)}
    >
      <div className="relative aspect-[3/4] bg-[#EFE8DC] overflow-hidden mb-4">
        <img
          src={isHovered ? product.hoverImage : product.image}
          alt={product.name}
          onClick={() => onSelectProduct(product)}
          className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
        />

        <button
          onClick={(e) => {
            e.stopPropagation();
            onToggleWishlist(product);
          }}
          className="absolute top-3 right-3 p-2 bg-[#F7F3EC]/80 rounded-full hover:bg-[#F7F3EC]"
        >
          <Heart
            className={`w-4 h-4 ${
              isWishlisted ? "fill-[#171310] text-[#171310]" : "text-[#171310]"
            }`}
          />
        </button>
      </div>

      <div className="space-y-1">
        <span className="text-[10px] uppercase tracking-[0.2em] text-[#A89A89]">
          {product.category}
        </span>
        <h4
          onClick={() => onSelectProduct(product)}
          className="font-serif text-lg font-light hover:text-[#B69A68] transition-colors"
        >
          {product.name}
        </h4>
        <div className="flex items-center gap-2">
          <span className="text-xs font-medium">${product.price}</span>
        </div>
      </div>
    </div>
  );
}

function ShopPage({ products, selectedCategory, setSelectedCategory, sortBy, setSortBy, onQuickView, onSelectProduct, onAddToCart, onToggleWishlist, wishlist }) {
  return (

      </div>
      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
        {products.map((product) => (
          <ProductCard
            key={product.id}
            product={product}
            onQuickView={onQuickView}
            onSelectProduct={onSelectProduct}

}

function ProductDetailsPage({ product, onBack, onAddToCart, onToggleWishlist, isWishlisted, allProducts, onSelectProduct }) {

      <div className="grid grid-cols-1 lg:grid-cols-12 gap-12">
        <div className="lg:col-span-7">
          <img src={product.image} alt={product.name} className="w-full h-auto object-cover" />
        </div>
        <div className="lg:col-span-5 space-y-6">
          <h1 className="font-serif text-4xl">{product.name}</h1>
          <p className="text-2xl">${product.price}</p>
          <p className="text-xs leading-relaxed">{product.description}</p>
          <button onClick={() => onAddToCart(product)} className="w-full bg-[#171310] text-[#F7F3EC] py-4 text-xs uppercase tracking-widest">Add to Bag</button>

    </div>
  );
}
